<script>
    // Dữ liệu ban đầu
    let addresses = [
        { id: 1, name: "Ánh Tuyết", phone: "0847563929", detail: "Nhà số 6, phường Thanh Liệt, Đường Kim Giang, Hà Nội", isDefault: true },
        { id: 2, name: "Ánh Tuyết", phone: "0847563929", detail: "Nhà số 7, phường Thanh Liệt, Đường Kim Giang, Hà Nội", isDefault: false }
    ];

    // Hàm hiển thị danh sách địa chỉ (Render)
    function renderAddresses() {
        const listContainer = document.getElementById('address-list');
        listContainer.innerHTML = "";

        // Sắp xếp địa chỉ mặc định lên đầu
        const sortedAddresses = [...addresses].sort((a, b) => b.isDefault - a.isDefault);

        sortedAddresses.forEach(addr => {
            const html = `
                <div class="address-item flex flex-col md:flex-row justify-between border-b border-slate-100 pb-6 gap-4 transition-all duration-300" data-id="${addr.id}">
                    <div class="space-y-2">
                        <div class="flex items-center gap-3">
                            <span class="user-name font-bold text-slate-800 border-r border-slate-300 pr-3 italic">${addr.name}</span>
                            <span class="user-phone text-slate-500">(+84) ${addr.phone.slice(-9)}</span>
                        </div>
                        <p class="user-address text-sm text-slate-500">${addr.detail}</p>
                        ${addr.isDefault ? '<span class="default-badge inline-block border border-pink-400 text-pink-500 text-[10px] px-2 py-0.5 rounded mt-2 font-medium">Mặc định</span>' : ''}
                    </div>
                    <div class="flex flex-col items-end gap-3 justify-start">
                        <div class="flex gap-3">
                            <button onclick="editAddress(${addr.id})" class="text-blue-600 text-sm hover:underline font-medium">Cập nhật</button>
                            ${!addr.isDefault ? `<span class="text-slate-300">|</span><button onclick="deleteAddress(${addr.id})" class="text-red-500 text-sm hover:underline font-medium">Xóa</button>` : ''}
                        </div>
                        ${!addr.isDefault ? `<button onclick="setDefault(${addr.id})" class="set-default-btn border border-slate-300 text-slate-600 px-4 py-2 text-sm rounded hover:bg-slate-50 transition-all active:bg-slate-100">Thiết lập mặc định</button>` : ''}
                    </div>
                </div>
            `;
            listContainer.insertAdjacentHTML('beforeend', html);
        });
    }

    // --- CÁC HÀM ĐIỀU KHIỂN MODAL ---
    function openAddressModal() {
        document.getElementById('modal-title').innerText = "Địa chỉ mới";
        document.getElementById('address-form').reset();
        document.getElementById('edit-id').value = "";
        hideAllErrors();
        document.getElementById('address-modal').classList.replace('hidden', 'flex');
    }

    function closeModal() {
        document.getElementById('address-modal').classList.replace('flex', 'hidden');
    }

    function hideAllErrors() {
        ['fullname', 'phone', 'address'].forEach(id => {
            document.getElementById(`error-${id}`).classList.add('hidden');
            document.getElementById(id === 'address' ? 'address-detail' : id).classList.remove('border-red-500');
        });
    }

    function showError(id, message) {
        const input = document.getElementById(id === 'address' ? 'address-detail' : id);
        const error = document.getElementById(`error-${id}`);
        input.classList.add('border-red-500');
        error.innerText = message;
        error.classList.remove('hidden');
    }

    function showToast(message) {
        const toast = document.getElementById('toast');
        document.getElementById('toast-message').innerText = message;
        toast.style.opacity = '1';
        toast.style.transform = 'translate(-50%, -20px)';
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translate(-50%, 40px)';
        }, 3000);
    }

    // --- XỬ LÝ DỮ LIỆU ---
    function validateAndSave() {
        const name = document.getElementById('fullname').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const detail = document.getElementById('address-detail').value.trim();
        const editId = document.getElementById('edit-id').value;
        const phoneRegex = /^(0|84)(3|5|7|8|9)([0-9]{8})$/;
        
        let isValid = true;
        hideAllErrors();

        if (!name) { showError('fullname', 'Họ tên không được để trống'); isValid = false; }
        if (!phone) { showError('phone', 'Số điện thoại không được để trống'); isValid = false; }
        else if (!phoneRegex.test(phone)) { showError('phone', 'SĐT phải đúng 10 số (VN)'); isValid = false; }
        if (!detail) { showError('address', 'Địa chỉ không được để trống'); isValid = false; }

        if (isValid) {
            if (editId) {
                // Cập nhật địa chỉ cũ
                const index = addresses.findIndex(a => a.id == editId);
                addresses[index] = { ...addresses[index], name, phone, detail };
                showToast("Đã cập nhật thông tin thành công!");
            } else {
                // Thêm địa chỉ mới
                const newAddr = { id: Date.now(), name, phone, detail, isDefault: false };
                addresses.push(newAddr);
                showToast("Thêm địa chỉ mới thành công!");
            }
            closeModal();
            renderAddresses();
        }
    }

    function setDefault(id) {
        addresses.forEach(addr => addr.isDefault = (addr.id === id));
        renderAddresses();
        showToast("Đã thiết lập địa chỉ mặc định!");
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function editAddress(id) {
        const addr = addresses.find(a => a.id === id);
        document.getElementById('modal-title').innerText = "Chỉnh sửa địa chỉ";
        document.getElementById('edit-id').value = addr.id;
        document.getElementById('fullname').value = addr.name;
        document.getElementById('phone').value = addr.phone;
        document.getElementById('address-detail').value = addr.detail;
        
        hideAllErrors();
        document.getElementById('address-modal').classList.replace('hidden', 'flex');
    }

    function deleteAddress(id) {
        if (confirm("Bạn có chắc chắn muốn xóa địa chỉ này?")) {
            addresses = addresses.filter(a => a.id !== id);
            renderAddresses();
            showToast("Đã xóa địa chỉ!");
        }
    }

    // Chạy render ngay khi trang tải
    document.addEventListener('DOMContentLoaded', renderAddresses);
</script>
