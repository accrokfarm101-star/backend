<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Fresh Mart</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        /* Thêm font nếu bạn muốn đúng style Maven Pro */
        @import url('https://fonts.googleapis.com/css2?family=Maven+Pro:wght@400;600;700&display=swap');
        body { font-family: 'Maven Pro', sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-gray-50">

    <div id="header-container"></div>

    <!-- Login Content -->
    <div class="flex items-center justify-center min-h-[80vh] px-4 py-12" style="margin-top: 2cm;">
        <!-- Bỏ position relative để các phần tử bên trong không bị loạn -->
        <div class="w-full max-w-xl rounded-3xl p-10 shadow-lg" style="background: #DCEBCF;">
            
            <div class="text-center mb-8">
                <h2 class="text-4xl font-semibold text-black/80 mb-2">Đăng Nhập</h2>
                <p class="text-sm font-bold text-black/80 leading-relaxed">
                    Chào mừng bạn đến với chúng tôi!<br/>Vui lòng nhập thông tin của bạn
                </p>
            </div>

            <form class="space-y-6" id="loginForm">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="loginEmail" required placeholder="Nhập email của bạn" 
                           class="w-full px-5 py-3 rounded-2xl border-none outline-none focus:ring-2 focus:ring-green-500 bg-white">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu</label>
                    <input type="password" id="loginPassword" required placeholder="Nhập mật khẩu" 
                           class="w-full px-5 py-3 rounded-2xl border-none outline-none focus:ring-2 focus:ring-green-500 bg-white">
                </div>

                <div class="text-right">
                    <a href="#" class="text-red-600 hover:text-red-700 text-sm font-medium transition-colors">Quên mật khẩu?</a>
                </div>

                <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-4 rounded-2xl transition-all transform active:scale-95 text-lg shadow-md">
                    Đăng nhập
                </button>
            </form>

            <div class="text-center mt-8">
                <span class="text-gray-600">Chưa có tài khoản?</span>
                <a href="dang_ky.html" class="text-green-700 font-semibold hover:underline ml-1">Đăng ký ngay</a>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="../../assets/js/main.js"></script>
</body>
</html>
