<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo tài khoản - Fresh Mart</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Maven+Pro:wght@400;600;700&display=swap');
        body { font-family: 'Maven Pro', sans-serif; }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 500;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 9999;
            pointer-events: none;
        }
        .toast.show  { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.success { background: #166534; color: #fff; }
        .toast.error   { background: #991b1b; color: #fff; }
    </style>
</head>
<body class="min-h-screen bg-gray-50">

<div id="header-container"></div>

<div class="flex items-center justify-center min-h-[80vh] px-4 py-12" style="margin-top: 2cm;">
    <div class="w-full max-w-2xl rounded-3xl p-10" style="background: #DCEBCF;">

        <div class="text-center mb-8">
            <h2 class="text-3xl font-extrabold text-green-800">Tạo tài khoản</h2>
            <p class="text-green-700 mt-2 font-semibold">Chào mừng bạn đến với FreshMart</p>
        </div>

        <form class="space-y-5" id="registerForm" novalidate>

            <!-- Họ + Tên → gộp thành username -->
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Họ</label>
                    <input type="text" id="ho" placeholder="Nhập họ"
                           class="w-full px-5 py-3 rounded-2xl border-2 border-transparent
                                      focus:border-green-500 outline-none bg-white transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Tên</label>
                    <input type="text" id="ten" placeholder="Nhập tên"
                           class="w-full px-5 py-3 rounded-2xl border-2 border-transparent
                                      focus:border-green-500 outline-none bg-white transition">
                </div>
            </div>
            <p class="text-red-500 text-xs -mt-3 hidden" id="nameError">
                Vui lòng nhập họ và tên (tối thiểu 3 ký tự).
            </p>

            <!-- Email -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="email" placeholder="Nhập email của bạn"
                       class="w-full px-5 py-3 rounded-2xl border-2 border-transparent
                                  focus:border-green-500 outline-none bg-white transition">
                <p class="text-red-500 text-xs mt-1 hidden" id="emailError">
                    Vui lòng nhập email hợp lệ.
                </p>
            </div>

            <!-- Số điện thoại -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Số điện thoại</label>
                <input type="tel" id="sdt" placeholder="Nhập số điện thoại"
                       class="w-full px-5 py-3 rounded-2xl border-2 border-transparent
                                  focus:border-green-500 outline-none bg-white transition">
                <p class="text-red-500 text-xs mt-1 hidden" id="sdtError">
                    Vui lòng nhập số điện thoại hợp lệ.
                </p>
            </div>

            <!-- Mật khẩu -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu</label>
                <div class="relative">
                    <input type="password" id="password" placeholder="Nhập mật khẩu (ít nhất 6 ký tự)"
                           class="w-full px-5 py-3 rounded-2xl border-2 border-transparent
                                      focus:border-green-500 outline-none bg-white transition pr-12">
                    <button type="button" onclick="togglePass('password','eyePass')"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                        <i class="fas fa-eye" id="eyePass"></i>
                    </button>
                </div>
                <p class="text-red-500 text-xs mt-1 hidden" id="passwordError">
                    Mật khẩu phải ít nhất 6 ký tự.
                </p>
            </div>

            <!-- Nhập lại mật khẩu -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nhập lại mật khẩu</label>
                <div class="relative">
                    <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu"
                           class="w-full px-5 py-3 rounded-2xl border-2 border-transparent
                                      focus:border-green-500 outline-none bg-white transition pr-12">
                    <button type="button" onclick="togglePass('confirmPassword','eyeConfirm')"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                        <i class="fas fa-eye" id="eyeConfirm"></i>
                    </button>
                </div>
                <p class="text-red-500 text-xs mt-1 hidden" id="confirmError">
                    Mật khẩu nhập lại không khớp.
                </p>
            </div>

            <button type="submit" id="btnSubmit"
                    class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-4
                               rounded-2xl transition text-lg mt-6 disabled:opacity-60
                               disabled:cursor-not-allowed">
                Đăng ký
            </button>
        </form>

        <div class="text-center mt-6">
            <span class="text-gray-600">Đã có tài khoản?</span>
            <a href="dang_nhap.html" class="text-green-700 font-semibold hover:underline ml-1">
                Đăng nhập
            </a>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>
<div id="footer-container"></div>

<script src="../../assets/js/main.js"></script>
<script>
    const API_BASE = 'http://localhost:8080';

    // ── TOAST ──
    function showToast(msg, type = 'error') {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className   = `toast ${type} show`;
        clearTimeout(t._timer);
        t._timer = setTimeout(() => t.classList.remove('show'), 3500);
    }

    // ── SHOW/HIDE PASSWORD ──
    function togglePass(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon  = document.getElementById(iconId);
        const isHidden = input.type === 'password';
        input.type     = isHidden ? 'text' : 'password';
        icon.className = isHidden ? 'fas fa-eye-slash' : 'fas fa-eye';
    }

    // ── LOADING ──
    function setLoading(isLoading) {
        const btn = document.getElementById('btnSubmit');
        btn.disabled    = isLoading;
        btn.textContent = isLoading ? 'Đang đăng ký...' : 'Đăng ký';
    }

    // ── VALIDATE ──
    function validate(username, email, phone, password, confirmPassword) {
        let valid = true;

        // Username (họ + tên gộp lại)
        const nameErr = document.getElementById('nameError');
        if (!username || username.length < 3) {
            nameErr.classList.remove('hidden');
            valid = false;
        } else {
            nameErr.classList.add('hidden');
        }

        // Email
        const emailErr = document.getElementById('emailError');
        const emailReg = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!email || !emailReg.test(email)) {
            emailErr.classList.remove('hidden');
            valid = false;
        } else {
            emailErr.classList.add('hidden');
        }

        // SĐT
        const sdtErr = document.getElementById('sdtError');
        const sdtReg = /^[0-9]{9,11}$/;
        if (!phone || !sdtReg.test(phone)) {
            sdtErr.classList.remove('hidden');
            valid = false;
        } else {
            sdtErr.classList.add('hidden');
        }

        // Mật khẩu
        const passErr = document.getElementById('passwordError');
        if (!password || password.length < 6) {
            passErr.classList.remove('hidden');
            valid = false;
        } else {
            passErr.classList.add('hidden');
        }

        // Nhập lại mật khẩu
        const confirmErr = document.getElementById('confirmError');
        if (password !== confirmPassword) {
            confirmErr.classList.remove('hidden');
            valid = false;
        } else {
            confirmErr.classList.add('hidden');
        }

        return valid;
    }

    // ── SUBMIT ──
    document.getElementById('registerForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        const ho       = document.getElementById('ho').value.trim();
        const ten      = document.getElementById('ten').value.trim();
        const username = (ho + ' ' + ten).trim(); // gộp họ + tên → username
        const email    = document.getElementById('email').value.trim();
        const phone    = document.getElementById('sdt').value.trim();
        const password = document.getElementById('password').value;
        const confirm  = document.getElementById('confirmPassword').value;

        if (!validate(username, email, phone, password, confirm)) return;

        setLoading(true);

        try {
            const res  = await fetch(`${API_BASE}/api/auth/register`, {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                // Đúng với RegisterRequest: username, email, phone, password
                body: JSON.stringify({ username, email, phone, password })
            });

            const data = await res.json();

            if (!res.ok || data.success === false) {
                showToast(data.message || 'Đăng ký thất bại. Vui lòng thử lại.');
                return;
            }

            // Đăng ký thành công → lưu token luôn (backend trả AuthResponse)
            localStorage.setItem('token', data.data.token);
            localStorage.setItem('user',  JSON.stringify(data.data));

            showToast('Đăng ký thành công! Đang chuyển hướng...', 'success');
            setTimeout(() => {
                window.location.href = '../html_main/trang_san_pham.html';
            }, 1200);

        } catch (err) {
            console.error('Register error:', err);
            showToast('Không thể kết nối đến máy chủ. Vui lòng thử lại.');
        } finally {
            setLoading(false);
        }
    });
</script>
</body>
</html>
