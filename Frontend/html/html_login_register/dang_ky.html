<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo tài khoản - Fresh Mart</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body class="min-h-screen bg-gray-50">

    <div id="header-container"></div>

    <!-- Register Content -->
    <div class="flex items-center justify-center min-h-[80vh] px-4 py-12" style="margin-top: 2cm;">
        <div class="register-box w-full max-w-2xl rounded-3xl p-10" style="background: #DCEBCF;">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-extrabold text-green-800">Tạo tài khoản</h2>
                <p class="text-green-700 mt-2 font-semibold">Chào mừng bạn đến với FreshMart</p>
            </div>

            <form class="space-y-6" id="registerForm">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Họ</label>
                        <input type="text" id="ho" placeholder="Nhập họ" class="w-full px-5 py-3 rounded-2xl border border-transparent focus:border-green-500 bg-white">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Tên</label>
                        <input type="text" id="ten" placeholder="Nhập tên" class="w-full px-5 py-3 rounded-2xl border border-transparent focus:border-green-500 bg-white">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="email" placeholder="Nhập email của bạn" class="w-full px-5 py-3 rounded-2xl border border-transparent focus:border-green-500 bg-white">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Số điện thoại</label>
                    <input type="tel" id="sdt" placeholder="Nhập số điện thoại" class="w-full px-5 py-3 rounded-2xl border border-transparent focus:border-green-500 bg-white">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu</label>
                    <input type="password" id="password" placeholder="Nhập mật khẩu" class="w-full px-5 py-3 rounded-2xl border border-transparent focus:border-green-500 bg-white">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nhập lại mật khẩu</label>
                    <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu" class="w-full px-5 py-3 rounded-2xl border border-transparent focus:border-green-500 bg-white">
                </div>

                <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-4 rounded-2xl transition text-lg mt-6">
                    Đăng ký
                </button>
            </form>

            <div class="text-center mt-6">
                <span class="text-gray-600">Đã có tài khoản?</span>
                <a href="dang_nhap.html" class="text-green-700 font-semibold hover:underline ml-1">Đăng nhập</a>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="../../assets/js/main.js"></script>
</body>
</html>
