<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cửa hàng thực phẩm sạch | Fresh Mart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        /* Thiết lập phông chữ chuẩn hệ thống */
        body { font-family: 'Be Vietnam Pro', sans-serif; background-color: #f8fafc; }
        .product-card { background-color: #ffffff; transition: all 0.3s ease; }
        .product-card:hover { transform: translateY(-4px); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        .category-item-active {
            color: #16a34a;
            font-weight: 900;
            background-color: #f0fdf4;
            border-left: 4px solid #16a34a;
        }
        
        /* Đồng bộ chữ gợi ý ô tìm kiếm */
        #search-input::placeholder {
            font-size: 13px;
            opacity: 0.8;
        }
        
        /* Cấu trúc mượt cho Carousel đường trượt mượt */
        #carouselTrack { display: flex; gap: 24px; transition: transform 0.5s ease-in-out; }
    </style>
</head>
<body class="bg-slate-50 antialiased">

<header class="bg-[#DCEBCF] border-b sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4">
        <div class="flex items-center justify-between py-3">
            
            <h1 class="text-[40px] leading-none font-bold italic text-[#2f6b2f]"
                style="font-family: 'Georgia', serif; margin-left: -2cm;">
                <a href="trang_chu.html">Fresh Mart</a>
            </h1>
            
            <div class="flex-1 max-w-2xl mx-8" style="margin-left: -7cm;">
                <div class="relative">
                    <input type="text" id="search-input" oninput="filterProducts()" placeholder="Tìm kiếm trong Fresh Mart" 
                           class="w-full py-3 px-5 rounded-full border border-green-200 focus:outline-none focus:border-green-500 bg-white text-[13px]">
                    <button class="absolute right-4 top-1/2 -translate-y-1/2 text-green-600">
                        <i class="fas fa-search text-xl"></i>
                    </button>
                </div>
            </div>

            <div class="flex items-center gap-4" style="margin-left: -6cm;">
                <a href="gio_hang.html" class="relative p-3 hover:bg-green-100 rounded-full inline-flex items-center" style="margin-left: -3cm;">
                    <i class="fas fa-shopping-cart text-3xl text-green-700"></i>
                </a>

                <button class="bg-[#f6f7ef] px-6 py-2 rounded-3xl text-[14px] font-semibold text-[#456b3f] hover:bg-white transition">
                    <a href="../html_person/ho_so.html" class="inline-flex items-center">
                        Ánh Tuyết
                    </a>
                </button>

                <img src="https://i.pravatar.cc/120?img=32" alt="avatar" class="w-[50px] h-[50px] rounded-full object-cover">
            </div>
        </div>
    </div>

    <nav class="bg-[#ffffff] border-white">
        <div class="max-w-[1920px] mx-auto px-16">
            <ul class="flex items-center justify-between h-[35px]">
                <li><a href="trang_chu.html" class="text-[14px] font-semibold text-green-700 hover:text-green-700 transition">Trang chủ</a></li>
                <li><a href="trang_gioi_thieu.html" class="text-[14px] font-semibold text-black hover:text-green-700 transition">Giới thiệu</a></li>
                <li><a href="trang_san_pham.html" class="text-[14px] font-semibold text-black hover:text-green-700 transition">Sản phẩm</a></li>
                <li><a href="trang_cau_hoi.html" class="text-[14px] font-semibold text-black hover:text-green-700 transition">Câu hỏi</a></li>
                <li><a href="trang_tin_tuc.html" class="text-[14px] font-semibold text-black hover:text-green-700 transition">Tin tức</a></li>
                <li><a href="trang_lien_he.html" class="text-[14px] font-semibold text-black hover:text-green-700 transition">Liên hệ</a></li>
            </ul>
        </div>
    </nav>
</header>

<section class="hero-bg h-[500px] relative flex items-center justify-center text-white overflow-hidden">
    <div class="absolute inset-0 bg-black/40 z-10"></div>
    <img src="../../image/banner.png" alt="Fresh Organic Food" class="absolute inset-0 w-full h-full object-cover">
</section>

<section class="max-w-7xl mx-auto px-4 py-16 bg-[#ffffff]">
    <h2 class="text-3xl font-black text-center mb-12 text-[#396337] tracking-tight uppercase" style="font-family: 'Be Vietnam Pro', sans-serif;">Danh mục sản phẩm</h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-10">
        
        <div onclick="redirectToCategory('Rau củ')" class="flex items-center justify-between bg-[#679156] rounded-[40px] p-6 hover:shadow-xl transition-all cursor-pointer group">
            <div class="w-4/5 flex justify-center items-center p-1">
                <img src="../../image/rauca.png" alt="Rau Củ" class="w-full h-auto max-w-[220px] object-contain transform group-hover:scale-110 transition-all duration-300">
            </div>
            <div class="w-2/5 text-center">
                <h3 class="text-[#DCEBCF] text-3xl font-black leading-tight tracking-tight" style="font-family: 'Be Vietnam Pro', sans-serif;">Rau <br> Củ</h3>
            </div>
        </div>
        
        <div onclick="redirectToCategory('Trái cây')" class="flex items-center justify-between bg-[#DCEBCF] rounded-[40px] p-6 hover:shadow-xl transition-all cursor-pointer group">
            <div class="w-4/5 flex justify-center items-center p-1">
                <img src="../../image/traicay.png" alt="Trái Cây" class="w-full h-auto max-w-[220px] object-contain transform group-hover:scale-110 transition-all duration-300">
            </div>
            <div class="w-2/5 text-center">
                <h3 class="text-[#396337] text-3xl font-black leading-tight tracking-tight" style="font-family: 'Be Vietnam Pro', sans-serif;">Trái <br> Cây</h3>
            </div>
        </div>
        
        <div onclick="redirectToCategory('Hạt')" class="flex items-center justify-between bg-[#396337] rounded-[40px] p-6 hover:shadow-xl transition-all cursor-pointer group">
            <div class="w-4/5 flex justify-center items-center p-1">
                <img src="../../image/hat.png" alt="Hạt" class="w-full h-auto max-w-[220px] object-contain transform group-hover:scale-110 transition-all duration-300">
            </div>
            <div class="w-2/5 text-center">
                <h3 class="text-[#DCEBCF] text-3xl font-black leading-tight tracking-tight" style="font-family: 'Be Vietnam Pro', sans-serif;">Hạt</h3>
            </div>
        </div>
        
        <div onclick="redirectToCategory('Thịt cá')" class="flex items-center justify-between bg-[#D7E8BB] rounded-[40px] p-6 hover:shadow-xl transition-all cursor-pointer group">
            <div class="w-4/5 flex justify-center items-center p-1">
                <img src="../../image/thitca.png" alt="Thịt Cá" class="w-full h-auto max-w-[220px] object-contain transform group-hover:scale-110 transition-all duration-300">
            </div>
            <div class="w-2/5 text-center">
                <h3 class="text-[#396337] text-3xl font-black leading-tight tracking-tight uppercase" style="font-family: 'Be Vietnam Pro', sans-serif;">Thịt <br> Cá</h3>
            </div>
        </div>
        
    </div>
</section>

<section class="bg-white py-12 border-t border-b border-slate-100">
    <div class="max-w-7xl mx-auto px-4">
        <div class="flex items-center justify-between mb-8">
            <h2 class="text-3xl font-black text-green-800 tracking-tight" style="font-family: 'Be Vietnam Pro', sans-serif;">Giá tốt tuần này</h2>
            <div class="flex gap-3">
                <button id="prevBtn" onclick="moveCarousel(-1)" class="w-11 h-11 border-2 border-green-700 text-green-700 rounded-full hover:bg-green-700 hover:text-white transition flex items-center justify-center">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <button id="nextBtn" onclick="moveCarousel(1)" class="w-11 h-11 border-2 border-green-700 text-green-700 rounded-full hover:bg-green-700 hover:text-white transition flex items-center justify-center">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>

        <div id="carousel" class="overflow-hidden">
            <div id="carouselTrack">
                </div>
        </div>
    </div>
</section>

<section class="max-w-7xl mx-auto px-4 py-16">
    <div class="flex items-center justify-between mb-8 border-b pb-4 border-slate-200/60">
        <h2 class="text-3xl font-black text-slate-800 tracking-tight" style="font-family: 'Be Vietnam Pro', sans-serif;">Tất cả sản phẩm có tại cửa hàng</h2>
        <span class="text-xs font-bold text-green-600 bg-green-50 px-4 py-2 rounded-xl border border-green-100 uppercase tracking-widest" style="font-family: 'Be Vietnam Pro', sans-serif;"><i class="fas fa-leaf"></i> Cam kết 100% tươi sạch</span>
    </div>
    
    <div id="all-products-grid" class="grid grid-cols-2 md:grid-cols-4 gap-6">
        </div>
</section>

<div id="footer-container"></div>

<div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-2xl opacity-0 translate-y-10 transition-all duration-500 z-[100] pointer-events-none text-sm font-medium">
    <span id="toast-message"></span>
</div>

<script src="../../assets/js/main.js"></script>
</body>
</html>
