# =========================================
# CỬA HÀNG THỰC PHẨM XANH - Cấu hình chính
# =========================================

# Cổng chạy server
server.port=8080

# Tên ứng dụng
spring.application.name=fresh-mart

# --- CƠ SỞ DỮ LIỆU (MySQL) ---
spring.datasource.url=jdbc:mysql://localhost:3306/fresh_mart?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=yourpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / HIBERNATE ---
# update: tự động cập nhật bảng khi entity thay đổi (dùng cho dev)
spring.jpa.hibernate.ddl-auto=update
# Hiển thị câu lệnh SQL trong console
spring.jpa.show-sql=true
# Định dạng SQL cho dễ đọc
spring.jpa.properties.hibernate.format_sql=true
# Dialect cho MySQL 8
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# --- XÁC THỰC JWT ---
# Khoá bí mật để ký token (đổi thành chuỗi ngẫu nhiên khi triển khai thực tế)
app.jwt.secret=fresh_mart_secret_key_change_in_production
# Thời hạn token: 86400000ms = 24 giờ
app.jwt.expiration=86400000

# Tải dữ liệu mặc định từ data.sql
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# --- UPLOAD FILE ---
# Giới hạn kích thước mỗi file ảnh
spring.servlet.multipart.max-file-size=10MB
# Giới hạn kích thước toàn bộ request
spring.servlet.multipart.max-request-size=10MB
# Thư mục lưu ảnh sản phẩm
app.upload.dir=uploads/

# --- GHI LOG ---
# Hiển thị log DEBUG cho toàn bộ package của dự án
logging.level.com.freshmart=DEBUG
