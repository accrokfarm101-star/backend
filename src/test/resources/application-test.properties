# Test Configuration - Using H2 In-Memory Database

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
# Force Hibernate dialect for tests (override main MySQL dialect)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=true

# Enable H2 Console for debugging
spring.h2.console.enabled=true

# SQL Initialization (disabled for tests; we seed via @BeforeEach)
spring.sql.init.enabled=false
spring.sql.init.mode=never

# JWT Configuration
app.jwt.secret=green_food_store_secret_key_test
app.jwt.expiration=86400000